<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>匠塗の看板 見た目案</title>
<style>
  body { margin: 0; background: #222724; color: #F4F0E7; font: 16px/1.8 system-ui, sans-serif; }
  main { max-width: 960px; margin: auto; padding: 28px 18px 60px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
  p.lead { margin: 0 0 22px; color: #d9d3c6; }
  figure { margin: 0 0 26px; }
  img { display: block; width: 100%; height: auto; border-radius: 4px; }
  img.close { image-rendering: auto; }
  figcaption { font-size: 14px; color: #c9c2b4; margin-top: 8px; }
  h2 { font-size: 17px; margin: 30px 0 8px; color: #d0b38f; }
  ul { padding-left: 1.2em; margin: 0; }
  li { margin: 4px 0; }
</style>
</head>
<body>
<main>
  <h1>匠塗の看板　見た目案</h1>
  <p class="lead">事務所の写真に、Blender で作った看板を置いた見本です。写真も看板も架空です。</p>

  <figure>
    <img src="assets/day.webp" width="1536" height="1024" alt="2階建ての事務所の正面。シャッターと入口の上の壁に、墨黒の横長の看板">
    <figcaption>昼・くもり。道路から見た全体</figcaption>
  </figure>

  <figure>
    <img class="close" src="assets/day-close.webp" width="620" height="200" alt="看板の拡大。真鍮色の匠塗、徳島の印、TAKUTO PAINT WORKS、外壁・屋根塗装と電話番号">
    <figcaption>看板の部分を拡大（元の写真の大きさのまま広げたので、少しぼやけます）</figcaption>
  </figure>

  <h2>看板の作り</h2>
  <ul>
    <li>墨黒のアルミ複合板の箱看板。幅3.6m・高さ78cm</li>
    <li>「匠塗」は真鍮色の金属の切り文字で、板から少し浮かせて影を出す</li>
    <li>サイトのロゴと同じく「徳島」の印と TAKUTO PAINT WORKS を添える</li>
    <li>右側に「外壁・屋根塗装」と電話番号（見本用の番号）を生成りの色で</li>
    <li>上の2つの照明は、夕方の版で点けて文字を照らす予定</li>
  </ul>

  <h2>このあと</h2>
  <ul>
    <li>この方向でよければ、夕方に照明が点いた写真と、看板へ寄っていく短い動画を作ります</li>
  </ul>
</main>
</body>
</html>
