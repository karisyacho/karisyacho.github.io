<h1>匠塗の看板　Blenderでの見え方</h1>
<p>採用された第5案をもとに、看板と周りの壁を3Dで作りました。家とローラーの絵柄は、板に印刷された平面のデザインです。</p>
<h2>カメラの動き（6秒・無音）</h2>
<video controls playsinline preload="metadata" poster="assets/blender-v5-angle.png" aria-label="斜めから正面へ移動して看板を見る、6秒の無音の確認動画"><source src="assets/blender-v5-preview.mp4" type="video/mp4">動画を再生できない場合は、下のリンクから開いてください。</video>
<p class="note"><a href="assets/blender-v5-preview.mp4">動画を直接開く</a>。広告に使う素材の確認用です。</p>
<h2>正面</h2>
<figure><a href="assets/blender-v5-front.png"><img src="assets/blender-v5-front.png" alt="長方形の匠塗の看板を正面から見たBlenderの描画。外壁・屋根塗装、匠塗、見本用の電話番号が入っている。" loading="lazy"></a><figcaption>画像を押すと大きく開きます。</figcaption></figure>
<h2>斜め</h2>
<figure><a href="assets/blender-v5-angle.png"><img src="assets/blender-v5-angle.png" alt="看板を斜めから見たBlenderの描画。板の厚みと壁に落ちる影を確認できる。" loading="lazy"></a><figcaption>普通の長方形の板として作っています。</figcaption></figure>
<p class="note">会社は架空です。広告全体の編集やナレーションは、まだ入れていません。<a href="v5.html">採用した見た目案</a></p>
