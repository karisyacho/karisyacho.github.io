<svg xmlns="http://www.w3.org/2000/svg" width="600" height="660" viewBox="0 0 600 660" role="img" aria-label="S0 / 不透明な変形面"><rect width="600" height="660" fill="#090a0c"/><g fill="#edf0f3" font-family="sans-serif"><text x="32" y="44" font-size="25">S0 / 不透明な変形面</text><rect x="32" y="75" width="536" height="82" rx="3" fill="#20242a" stroke="#71767d"/><text x="50" y="106" font-size="22">入力 → 面との交点・布UV</text><text x="50" y="136" font-size="18" fill="#c3c7cd">PC/SPの画面座標から荷重点を取得</text><path d="M300 163v24m-7-7 7 7 7-7" fill="none" stroke="#c3c7cd" stroke-width="2"/><rect x="32" y="199" width="536" height="82" rx="3" fill="#20242a" stroke="#71767d"/><text x="50" y="230" font-size="22">共通の基準面＋張力の稜線</text><text x="50" y="260" font-size="18" fill="#c3c7cd">PC/SP別の配置 ／ S4も同じ形状を使用</text><path d="M300 287v24m-7-7 7 7 7-7" fill="none" stroke="#c3c7cd" stroke-width="2"/><rect x="32" y="323" width="536" height="82" rx="3" fill="#20242a" stroke="#71767d"/><text x="50" y="354" font-size="22">接触による沈み・復元</text><text x="50" y="384" font-size="18" fill="#c3c7cd">稜線方向に広がる変位 ／ 周縁は固定</text><path d="M300 411v24m-7-7 7 7 7-7" fill="none" stroke="#c3c7cd" stroke-width="2"/><rect x="32" y="447" width="536" height="82" rx="3" fill="#20242a" stroke="#71767d"/><text x="50" y="478" font-size="22">法線・粗さ＋左上からの光</text><text x="50" y="508" font-size="18" fill="#c3c7cd">形状と陰影が応答 ／ 接点alphaは変えない</text><text x="32" y="571" font-size="20">文字はHTMLで上に配置</text><text x="32" y="604" font-size="18" fill="#c3c7cd">稜線の設計図。膜素材・変形処理は未制作。</text></g></svg>