<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1270" viewBox="0 0 600 1270" role="img" aria-label="S2 / 独立する3枚の布"><rect width="600" height="1270" fill="#090a0c"/><g fill="#edf0f3" font-family="sans-serif"><text x="32" y="44" font-size="25">S2 / 独立する3枚の布</text><rect x="32" y="75" width="536" height="82" rx="3" fill="#20242a" stroke="#71767d"/><text x="50" y="106" font-size="22">L1 前景：厚い織布</text><text x="50" y="136" font-size="18" fill="#c3c7cd">外形alpha ／ 本体は不透明 ／ 重い応答</text><rect x="32" y="175" width="536" height="82" rx="3" fill="#20242a" stroke="#71767d"/><text x="50" y="206" font-size="22">L2 中景：薄い布</text><text x="50" y="236" font-size="18" fill="#c3c7cd">外形alpha＋透過率 ／ 軽い応答</text><rect x="32" y="275" width="536" height="82" rx="3" fill="#20242a" stroke="#71767d"/><text x="50" y="306" font-size="22">L3 後景：未染の基準布</text><text x="50" y="336" font-size="18" fill="#c3c7cd">外形alpha ／ 最小の変位 ／ S3とUV共有</text><text x="32" y="397" font-size="20">合成順：L3 → L2 → L1 → HTML文字</text><text x="32" y="433" font-size="18" fill="#c3c7cd">各層は隠れた面と固有の材質まで必要。</text><text x="32" y="482" font-size="22">PC：露出した操作帯の目標</text><rect x="32" y="506" width="536" height="260" fill="#14171b" stroke="#71767d"/><rect x="96" y="558" width="214" height="125" fill="#585858" fill-opacity=".6"/><text x="104" y="588" font-size="20">L1</text><rect x="311" y="563" width="118" height="125" fill="#777782" fill-opacity=".6"/><text x="319" y="593" font-size="20">L2</text><rect x="450" y="579" width="70" height="125" fill="#334052" fill-opacity=".6"/><text x="458" y="609" font-size="20">L3</text><text x="45" y="744" font-size="17">実際の布の外形・alphaで判定</text><text x="32" y="816" font-size="22">SP：縦の露出帯を3枚に確保</text><rect x="180" y="840" width="240" height="330" fill="#14171b" stroke="#71767d"/><rect x="204" y="922" width="57" height="170" fill="#585858" fill-opacity=".65"/><text x="210" y="955" font-size="20">L1</text><rect x="266" y="922" width="60" height="170" fill="#777782" fill-opacity=".65"/><text x="272" y="955" font-size="20">L2</text><rect x="343" y="922" width="48" height="170" fill="#334052" fill-opacity=".65"/><text x="349" y="955" font-size="20">L3</text><text x="32" y="1206" font-size="18" fill="#c3c7cd">図は操作帯の配置案。G1の布形状は保持する。</text><text x="32" y="1236" font-size="18" fill="#c3c7cd">矩形の当たり判定ではない。寸法は本文参照。</text></g></svg>