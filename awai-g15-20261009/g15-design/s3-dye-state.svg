<svg xmlns="http://www.w3.org/2000/svg" width="600" height="830" viewBox="0 0 600 830" role="img" aria-label="S3 / 皺を変えずに、染色を残す"><rect width="600" height="830" fill="#090a0c"/><g fill="#edf0f3" font-family="sans-serif"><text x="32" y="44" font-size="25">S3 / 皺を変えずに、染色を残す</text><rect x="32" y="75" width="536" height="82" rx="3" fill="#20242a" stroke="#71767d"/><text x="50" y="106" font-size="22">一枚の未染布：L3から継続</text><text x="50" y="136" font-size="18" fill="#c3c7cd">形状・UV・法線・織り目は染色前後で共通</text><path d="M300 163v24m-7-7 7 7 7-7" fill="none" stroke="#c3c7cd" stroke-width="2"/><rect x="32" y="199" width="536" height="82" rx="3" fill="#20242a" stroke="#71767d"/><text x="50" y="230" font-size="22">交点UV → 染料の投入</text><text x="50" y="260" font-size="18" fill="#c3c7cd">CPUに入力履歴 ／ 画面座標へ固定しない</text><path d="M300 287v24m-7-7 7 7 7-7" fill="none" stroke="#c3c7cd" stroke-width="2"/><rect x="32" y="323" width="536" height="82" rx="3" fill="#20242a" stroke="#71767d"/><text x="50" y="354" font-size="22">状態A ⇄ 状態B：交互に更新</text><text x="50" y="384" font-size="18" fill="#c3c7cd">W：湿潤・拡散 ／ B：定着・減らさない</text><path d="M300 411v24m-7-7 7 7 7-7" fill="none" stroke="#c3c7cd" stroke-width="2"/><rect x="32" y="447" width="536" height="82" rx="3" fill="#20242a" stroke="#71767d"/><text x="50" y="478" font-size="22">方向場＋吸着差で広がる</text><text x="50" y="508" font-size="18" fill="#c3c7cd">経糸・緯糸に沿う ／ 解除後もBを保持</text><path d="M300 535v24m-7-7 7 7 7-7" fill="none" stroke="#c3c7cd" stroke-width="2"/><rect x="32" y="571" width="536" height="82" rx="3" fill="#20242a" stroke="#71767d"/><text x="50" y="602" font-size="22">同じ布の色・粗さへ反映</text><text x="50" y="632" font-size="18" fill="#c3c7cd">時間進行用の染色場は別に合成</text><text x="32" y="698" font-size="20">checkpoint＋履歴 → 復旧・回転にも保持</text><text x="32" y="735" font-size="18" fill="#c3c7cd">第一候補：GPU ／ 代替候補：CPU低解像度格子</text><text x="32" y="770" font-size="18" fill="#c3c7cd">構成図のみ。拡散・保持の動作は未検証。</text></g></svg>