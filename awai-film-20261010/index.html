<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="dark">
  <title>あわい</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="film.css">
  <script src="film.js" defer></script>
</head>
<body>
  <main class="film" aria-label="あわい、五つの場面">
    <div class="stage">
      <section class="scene s0" aria-label="あわい">
        <div class="frame">
          <picture class="photo"><source media="(orientation: portrait)" srcset="assets/s0-sp.webp"><img src="assets/s0-pc.webp" width="1659" height="948" alt="左上の光を受け、斜めの稜線が走る黒い膜" decoding="async" fetchpriority="high"></picture>
          <div class="lettering"><h1 class="scene-title">あわい</h1></div>
        </div>
      </section>
      <section class="scene s1" aria-label="助任珈琲豆店">
        <div class="frame">
          <picture class="photo"><source media="(orientation: portrait)" srcset="assets/s1-sp.webp"><img src="assets/s1-pc.webp" width="1659" height="948" alt="暗い空間に浮かぶ、珈琲焙煎機の縁の弧" decoding="async"></picture>
          <div class="lettering"><h2 class="scene-title">助任珈琲豆店</h2></div>
        </div>
      </section>
      <section class="scene s2" aria-label="KASANE">
        <div class="frame">
          <picture class="photo"><source media="(orientation: portrait)" srcset="assets/s2-sp.webp"><img src="assets/s2-pc.webp" width="1659" height="948" alt="左上から右下へ、透ける布の端が重なる" decoding="async"></picture>
          <div class="lettering"><h2 class="scene-title">KASANE</h2></div>
        </div>
      </section>
      <section class="scene s3" aria-label="AIMA">
        <div class="frame">
          <picture class="photo"><source media="(orientation: portrait)" srcset="assets/s3-sp.webp"><img src="assets/s3-pc.webp" width="1659" height="948" alt="グラファイト色から藍へ染まる布に、斜めの折り目が走る" decoding="async"></picture>
          <div class="lettering"><h2 class="scene-title">AIMA</h2></div>
        </div>
      </section>
      <section class="scene s4" aria-label="ここに、あなたの店の話が入ります。">
        <div class="frame">
          <picture class="photo"><source media="(orientation: portrait)" srcset="assets/s4-sp.webp"><img src="assets/s4-pc.webp" width="1659" height="948" alt="冒頭の黒い膜と同じ稜線を残した、白い紙" decoding="async"></picture>
          <div class="lettering"><div class="closing-copy"><p>ここに、あなたの<span class="mobile-break"><br></span>店の話が入ります。</p><span class="contact-label">話してみる</span></div></div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
