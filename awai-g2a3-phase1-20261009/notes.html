<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G2-A3 静止構図の実装・検証</title><link rel="stylesheet" href="gallery.css"><style>main{max-width:960px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.9 "Yu Gothic",sans-serif}h1{font-size:27px}.reference{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}figcaption{font-size:12px}</style></head><body><main><p><a href="./">← 3状態の比較へ戻る</a></p><h1>実装・検証の詳細</h1><div class="reference"><figure><img src="evidence/sp-grid-only.webp" alt="従来のGrid接触、光オフ"><figcaption>従来のGrid接触／光オフ</figcaption></figure><figure><img src="evidence/sp-contact-grid.webp" alt="同じGrid接触、独立した奥の像"><figcaption>同じGrid／奥の像を追加</figcaption></figure></div><pre id="notes">資料を読み込み中</pre><h2>機械検証の実測</h2><pre id="verification">検証記録を読み込み中</pre><p><a href="notes.md">資料をテキストで開く</a> · <a href="evidence/verification.json">検証データ</a> · <a href="manifest.json">公開ファイルの記録</a></p></main><script>for(const [id,url]of[['notes','notes.md'],['verification','evidence/verification.md']])fetch(url).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()}).then(t=>document.getElementById(id).textContent=t).catch(e=>document.getElementById(id).textContent='読込できませんでした: '+e.message);</script></body></html>
