<script>document.documentElement.classList.add('js');document.documentElement.dataset.tone="dark";window.AWAI={root:"/",preview:false};</script>
</head>
<body class="nf">
<style>
.nf{min-height:100svh;background:var(--dark-900) url(/assets/media/letters-room-pc.webp) center/cover no-repeat}
.nf main{min-height:100svh;display:grid;align-content:center;padding:120px var(--gut) 80px}
.nf h1{margin-top:18px;font-family:var(--serif);font-weight:300;font-size:clamp(26px,3.2vw,44px);line-height:1.6;letter-spacing:.06em;word-break:keep-all}
.nf main>p:not(.eyebrow){margin-top:18px;max-width:30em;font-size:15px;color:var(--white-2)}
.nf .go{margin-top:36px;display:flex;flex-wrap:wrap;gap:20px 48px}
.nf .go a{display:inline-flex;align-items:center;gap:16px;min-height:48px;font-size:14px;letter-spacing:.12em}
.nf .ring{width:48px;height:48px;border:1px solid rgba(233,237,242,.4);border-radius:50%;display:grid;place-items:center}
@media (max-width:600px){.nf{background-image:url(/assets/media/letters-room-phone.webp)}}
</style>
<header class="site-header">
  <a class="logo" href="/" data-nav="top" aria-label="AWAI. トップへ">AWAI.</a>
  <nav aria-label="メインメニュー">
    <a href="/works/" data-nav="works">WORKS</a>
    <a href="/about/" data-nav="about">ABOUT</a>
    <a href="/contact/" data-nav="contact">CONTACT</a>
  </nav>
</header>
<script>(()=>{const h=document.querySelector('.site-header');let y=scrollY,f=0;const u=()=>{f=0;const n=scrollY;h.classList.toggle('is-off',n>40);if(Math.abs(n-y)>6){h.classList.toggle('is-tucked',n>y&&n>160&&!h.contains(document.activeElement));y=n;}};addEventListener('scroll',()=>{if(!f)f=requestAnimationFrame(u);},{passive:true});h.addEventListener('focusin',()=>h.classList.remove('is-tucked'));u();})();</script>
<main>
  <p class="eyebrow">404 / NOT FOUND</p>
  <h1>このページは、<wbr>見つかりませんでした。</h1>
  <p>URLが変わったか、なくなったページです。</p>
  <div class="go">
    <a href="/"><span class="ring"><svg width="18" height="10" viewBox="0 0 18 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M0 5h17M12.5 .5 17 5l-4.5 4.5"/></svg></span>トップへ戻る</a>
    <a href="/works/"><span class="ring"><svg width="18" height="10" viewBox="0 0 18 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M0 5h17M12.5 .5 17 5l-4.5 4.5"/></svg></span>制作を見る</a>
  </div>
</main>
</body>
</html>
