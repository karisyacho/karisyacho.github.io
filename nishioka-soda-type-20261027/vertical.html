<section class="review"><p class="study-label">A｜明朝の縦組み / 見た目の確認</p><h2>言葉を絞り、写真と形の中へ。</h2><p>水に反射する光の写真と、すだちの写真を合わせました。大きな二行見出しと巨大な英字を外し、商品を伝える一文に絞っています。</p><p>細い明朝を瓶の高さに沿わせ、縦の一文として置きました。文字と瓶の間に余白を残しています。</p><p>今回は静止した画面で、文字と構図を確認する案です。</p><div class="review-links"><a href="horizontal.html?v=material1">もう一つの文字案を見る ↗</a><a href="index.html?v=material1">二つの案を比べる ↗</a></div><p class="fiction">自主制作の架空ブランドです。商品は販売していません。</p></section>
