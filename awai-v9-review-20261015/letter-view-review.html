<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07090d"><title>あわい｜01の目線の比較</title><style>
:root{color-scheme:dark;font-family:system-ui,"Yu Gothic",sans-serif;background:#07090d;color:#e7e9ee}*{box-sizing:border-box}body{margin:0}header{padding:24px max(20px,calc((100vw - 1100px)/2));border-bottom:1px solid #30343e}h1{font-size:22px;font-weight:500;margin:0 0 12px}p{font-size:14px;line-height:1.9;margin:0 0 14px;color:#bcc1ca}nav{display:flex;gap:12px;margin:20px 0 0}button{font:inherit;min-height:44px;padding:8px 20px;border:1px solid #656b75;background:transparent;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#e1cdb3;color:#07090d;border-color:#e1cdb3}button:focus-visible,a:focus-visible{outline:2px solid #e1cdb3;outline-offset:4px}main{max-width:1440px;margin:auto}figure{margin:0}img{display:block;width:100%;height:auto}figcaption{padding:14px 20px;color:#bcc1ca;font-size:13px}footer{padding:24px 20px;border-top:1px solid #30343e;font-size:14px}a{color:#e1cdb3;text-underline-offset:4px}[hidden]{display:none!important}@media(max-width:700px){header{padding:20px}h1{font-size:20px}nav button{flex:1}img{max-width:480px;margin:auto}}
</style></head><body><header><h1>01「文字の中へ」の目線</h1><p>文字の形が見える高さで止まる案です。現行の低い目線と切り替えて比べられます。<br>調整案は、体験ページにはまだ反映していません。</p><nav aria-label="比較する画像"><button type="button" data-view="current" aria-pressed="false">現行</button><button type="button" data-view="proposed" aria-pressed="true">調整案</button></nav></header><main>
<figure id="current" hidden><picture><source media="(max-width:700px)" srcset="letter-view-current-sp.jpg"><img src="letter-view-current-pc.jpg" alt="現行：低い目線から、文字の画が壁になる足元を見る"></picture><figcaption>現行：文字の足元まで降りる目線。</figcaption></figure>
<figure id="proposed"><picture><source media="(max-width:700px)" srcset="letter-view-proposed-sp.png"><img src="letter-view-proposed-pc.png" alt="調整案：高さを残し、来たくなるという文字の上面と側面を見る"></picture><figcaption>調整案：文字の上面と側面が見える高さで止まる。</figcaption></figure>
</main><footer><a href="experience.html">現在の体験ページを開く</a></footer><script>
for(const button of document.querySelectorAll('button[data-view]'))button.addEventListener('click',()=>{for(const item of document.querySelectorAll('button[data-view]'))item.setAttribute('aria-pressed',String(item===button));for(const figure of document.querySelectorAll('figure'))figure.hidden=figure.id!==button.dataset.view;});
</script></body></html>
