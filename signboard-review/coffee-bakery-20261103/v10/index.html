<h1>おきのはま：店先のメニュー（型を鉄の色に）</h1>
<p>食パンの型がパンと同じ茶色で、茶色い箱に見えていました。型を鉄の色に変え、窯の奥を暗くして、焼き色の山が浮いて見えるようにしています。画像を押すと実寸で開きます。</p>
<a href="assets/menu-2.jpg"><img class="big" style="max-width:560px" src="assets/menu-2.jpg" alt="煉瓦の窯の中で、鉄の型から焼き色の三つの山がのぞく食パン。下に焼き上がりの時刻・品名・値段を6行並べた店先メニュー" width="1000" height="1500"></a>
<h2>少し離れて見たときの大きさ（幅200ピクセル）</h2>
<img class="small" style="width:200px" src="assets/menu-small-2.png" alt="同じメニューを小さくしたもの" width="200" height="300">
<h2>横長看板に同じ直しを入れた版</h2>
<p>横長も同じ食パンなので、型を鉄の色にした版を作りました。決まった版（下）のままにするか、こちらにそろえるかを選んでください。</p>
