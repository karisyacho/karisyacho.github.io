<h1>おきのはま：袖看板（縦長）</h1>
<p>上に、横長看板やメニューと同じ窯と鉄の型の食パンを置きました。下の額には店名を縦書きで2行に入れています。時刻は載せていません。2つの案は「製パン」の字の並べ方だけが違います。画像を押すと実寸で開きます。</p>
<h2>案A：「製パン」を「おきのはま」と同じ長さに広げる</h2>
<a href="assets/blade-1.jpg"><img class="big" style="max-width:300px" src="assets/blade-1.jpg" alt="煉瓦の窯の中に鉄の型の食パン。下の額に縦書きで、右におきのはま、左に製パンを同じ長さに広げて配置" width="600" height="1500"></a>
<h2>案B：「製パン」を詰めて上にそろえる</h2>
<a href="assets/blade-b-1.jpg"><img class="big" style="max-width:300px" src="assets/blade-b-1.jpg" alt="同じ袖看板で、製パンの3字を詰めて上にそろえた案" width="600" height="1500"></a>
<h2>遠くから見たときの大きさ（左がA、右がB）</h2>
<p style="display:flex;gap:24px"><img class="small" style="width:80px" src="assets/blade-1-small.png" alt="案Aを小さくしたもの" width="80" height="200"><img class="small" style="width:80px" src="assets/blade-b-1-small.png" alt="案Bを小さくしたもの" width="80" height="200"></p>

<a href="assets/fascia-tin-1.jpg"><img class="big" src="assets/fascia-tin-1.jpg" alt="鉄の型の食パンが窯から出てくる横長看板" width="1800" height="450"></a>
