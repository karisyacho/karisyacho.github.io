<h1>おきのはま：袖看板（縦長）</h1>
<p>「製パン」の列の頭と尻に、麦の穂の束を付けました。字のあいだにはもう何も挟んでいません。「製パン」の3字は詰めて並べ、麦の束まで含めた列の長さを「おきのはま」とそろえています。画像を押すと実寸で開きます。</p>
