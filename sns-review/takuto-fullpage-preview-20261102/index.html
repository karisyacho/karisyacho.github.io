<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>匠塗の動画に足す場面の確認</title><style>body{margin:0;background:#eeeee8;color:#252e28;font:16px/1.8 "Yu Gothic",Meiryo,sans-serif}main{max-width:640px;margin:auto;padding:24px 18px 48px}h1{font-size:24px;line-height:1.5}video,img{display:block;width:100%;height:auto;background:#fff}.box{padding:14px 16px;background:#faf9f3;margin:14px 0}</style><main><h1>匠塗の動画に足す場面（確認用）</h1><p>相談フォームの場面の後、締めの前に入れます。サイトのトップから相談フォームまで、9つの章を6秒で流します。</p><div class="box">画面の字：トップから、相談まで。<br>声：トップから相談まで、ページ全体をこの流れで組んでいます。</div><video controls playsinline muted loop src="fullpage.mp4"></video><p>流れる章を並べたもの（左上から右下へ）</p><img src="strip.jpg" alt="スクロールの途中のコマを並べた画像"><p>動画全体はまだ書き出していません。長さは約48秒になる見込みです。</p></main></html>
