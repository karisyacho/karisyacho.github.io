<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>匠塗の動画に足す場面の確認（2回目）</title><style>body{margin:0;background:#eeeee8;color:#252e28;font:16px/1.8 "Yu Gothic",Meiryo,sans-serif}main{max-width:640px;margin:auto;padding:24px 18px 48px}h1{font-size:24px;line-height:1.5}video,img{display:block;width:100%;height:auto;background:#fff}.box{padding:14px 16px;background:#faf9f3;margin:14px 0}ol{padding-left:1.4em}</style><main><h1>匠塗の動画に足す場面（2回目・声あり）</h1><p>相談フォームの場面の後、締めの前に入れます。9つの章で1回ずつ止まり、止まった章の名前を声で言います。約20秒です。</p><video controls playsinline src="tour.mp4"></video><div class="box">声<ol><li>トップから相談まで、迷わず進めるように順番を組んでいます。（トップ→施工事例）</li><li>会社の考え。</li><li>職人の流儀。</li><li>四つの仕事。</li><li>働く仲間。</li><li>地域への約束。</li><li>最後に流れとよくある質問を置いて、相談の前の不安を減らしています。（流れ→相談フォーム）</li></ol>画面の字：トップから、相談まで。</div><p>止まる9か所</p><img src="stops.jpg" alt="止まる9か所のコマを並べた画像"><p>動画全体はまだ書き出していません。足すと全体で約63秒になります。</p></main></html>
