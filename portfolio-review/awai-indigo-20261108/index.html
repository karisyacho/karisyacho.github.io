="幅48pxのB"><figcaption>48px</figcaption></figure></div></div></section><footer class="footer">藍色の見え方を確認するための修正版です。A・B・Cの形はまだ採用を決めたものではありません。本番サイトには反映していません。</footer></main></body></html>
